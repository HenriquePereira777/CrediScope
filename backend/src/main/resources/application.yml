spring:
  application:
    name: crediscope-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crediscope}
    username: ${DB_USER:crediscope}
    password: ${DB_PASSWORD:crediscope}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # o esquema do banco é controlado SOMENTE pelo Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:troque-este-segredo-em-producao-com-no-minimo-32-caracteres}
    expiracao-minutos: ${JWT_EXPIRACAO_MINUTOS:480}

serasa:
  # mock = dados fictícios (desenvolvimento) | api = chama a Serasa de verdade
  modo: ${SERASA_MODO:mock}
  base-url: ${SERASA_BASE_URL:}
  client-id: ${SERASA_CLIENT_ID:}
  client-secret: ${SERASA_CLIENT_SECRET:}
  timeout-segundos: ${SERASA_TIMEOUT_SEGUNDOS:15}
