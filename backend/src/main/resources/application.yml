# Todas as variáveis de ambiente do projeto começam com CREDISCOPE_
# para não conflitar com variáveis de outros projetos na mesma máquina.
# Os valores depois dos ":" são os padrões usados em desenvolvimento.

spring:
  application:
    name: crediscope-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${CREDISCOPE_DB_URL:jdbc:postgresql://localhost:5433/crediscope}
    username: ${CREDISCOPE_DB_USER:crediscope}
    password: ${CREDISCOPE_DB_PASSWORD:crediscope}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # o esquema do banco é controlado SOMENTE pelo Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${CREDISCOPE_PORTA_API:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CREDISCOPE_CORS_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${CREDISCOPE_JWT_SECRET:troque-este-segredo-em-producao-com-no-minimo-32-caracteres}
    expiracao-minutos: ${CREDISCOPE_JWT_EXPIRACAO_MINUTOS:480}
  sessao:
    # Cookie HttpOnly onde fica o token de login
    cookie-nome: CREDISCOPE_SESSAO
    # true = cookie só trafega em HTTPS. Deixe false em desenvolvimento (http://localhost)
    # e true em produção.
    cookie-seguro: ${CREDISCOPE_COOKIE_SEGURO:false}

serasa:
  # mock = dados fictícios (desenvolvimento) | api = chama a Serasa de verdade
  modo: ${CREDISCOPE_SERASA_MODO:mock}
  base-url: ${CREDISCOPE_SERASA_BASE_URL:}
  client-id: ${CREDISCOPE_SERASA_CLIENT_ID:}
  client-secret: ${CREDISCOPE_SERASA_CLIENT_SECRET:}
  timeout-segundos: ${CREDISCOPE_SERASA_TIMEOUT_SEGUNDOS:15}
