# CrediScope · ambiente completo
#   Só o banco (para desenvolver):  docker compose up -d postgres
#   Tudo (banco + API + web):       docker compose up -d --build

services:
  postgres:
    image: postgres:17-alpine
    container_name: crediscope-db
    environment:
      POSTGRES_DB: ${DB_NAME:-crediscope}
      POSTGRES_USER: ${DB_USER:-crediscope}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-crediscope}
      TZ: America/Sao_Paulo
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-crediscope} -d ${DB_NAME:-crediscope}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: crediscope-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-crediscope}
      DB_USER: ${DB_USER:-crediscope}
      DB_PASSWORD: ${DB_PASSWORD:-crediscope}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}
      SERASA_MODO: ${SERASA_MODO:-mock}
      SERASA_BASE_URL: ${SERASA_BASE_URL:-}
      SERASA_CLIENT_ID: ${SERASA_CLIENT_ID:-}
      SERASA_CLIENT_SECRET: ${SERASA_CLIENT_SECRET:-}
      TZ: America/Sao_Paulo
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: crediscope-web
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  pgdata:
